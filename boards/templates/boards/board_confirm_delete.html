{% extends 'base.html' %}

{% block title %}Eliminar tablero – TaskBoard{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm border-danger">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
        <h4 class="fw-bold">¿Eliminar tablero?</h4>
        <p class="text-muted">
          Vas a eliminar el tablero <strong>{{ board.title }}</strong> y todas sus columnas y tareas.
          Esta acción no se puede deshacer.
        </p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Sí, eliminar
          </button>
          <a href="{% url 'board_detail' board.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
