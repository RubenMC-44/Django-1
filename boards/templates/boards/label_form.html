{% extends 'base.html' %}

{% block title %}Nueva etiqueta – TaskBoard{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-tags me-2 text-primary"></i>Nueva etiqueta</h4>
        <p class="text-muted small mb-4">Tablero: <strong>{{ board.title }}</strong></p>

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre *</label>
            {{ form.name }}
            {% for error in form.name.errors %}
              <div class="text-danger small">{{ error }}</div>
            {% endfor %}
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Color</label>
            {{ form.color }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
            <a href="{% url 'board_detail' board.pk %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
